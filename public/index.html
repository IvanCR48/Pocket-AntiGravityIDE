<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Antigravity</title>
  <!-- Google Fonts: Inter & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked.js CDN for full Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Security PIN Lockscreen Modal -->
  <div id="auth-modal" class="auth-overlay" style="display: none;">
    <div class="auth-card">
      <div class="auth-icon-wrapper">
        <div class="auth-lock-icon">🔒</div>
      </div>
      <h2 class="auth-title">Pocket Antigravity</h2>
      <p class="auth-subtitle">Enter your security PIN to connect</p>
      
      <form id="auth-form" class="auth-form">
        <div class="pin-input-container">
          <input type="password" id="pin-input" class="pin-input" placeholder="••••" maxlength="8" inputmode="numeric" autocomplete="current-password" autofocus required>
        </div>
        <div id="auth-error" class="auth-error-msg" style="display: none;">Incorrect PIN</div>
        <button type="submit" id="auth-submit-btn" class="btn-auth-submit">Unlock Companion</button>
      </form>
    </div>
  </div>

  <header>
    <div class="top-row">
      <div class="brand">
        <span class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </span>
        <span class="brand-name">Pocket Antigravity</span>
        <span class="brand-badge">IDE</span>
      </div>
      <div class="status-group">
        <div id="status-badge" class="status-badge">
          <span class="status-dot"></span> <span>Connecting...</span>
        </div>
        <div id="chat-state-badge" class="status-badge" title="Live IDE Chat Focus State">
          <span class="status-dot" style="background:#858585"></span> <span>Chat: Checking...</span>
        </div>
        <button id="lock-btn" class="theme-toggle-btn" title="Lock App" style="display: none;">🔒</button>
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme">🌙</button>
      </div>
    </div>
    
    <div class="controls-row">
      <div class="tab-switcher">
        <button id="tab-chat-btn" class="tab-btn active">Chat</button>
        <button id="tab-files-btn" class="tab-btn">Files</button>
      </div>

      <button id="new-chat-btn" class="btn-new-chat" title="Create New Chat Session">
        <span>+</span> New Chat
      </button>
      
      <select id="session-select" class="session-selector pill-select" title="Active Session">
        <option>Loading sessions...</option>
      </select>
    </div>
  </header>

  <!-- View 1: Chat Stream -->
  <main id="chat-container" class="view-panel active">
    <!-- Real-time formatted chat messages rendered here -->
  </main>

  <!-- View 2: Workspace File Explorer -->
  <main id="files-container" class="view-panel" style="display: none;">
    <div class="files-header">
      <div class="explorer-title">
        <span>Workspace Files</span>
        <span class="explorer-subtitle">Tap files to inspect or attach to prompt</span>
      </div>
      <button id="refresh-files-btn" class="btn-sm">Refresh</button>
    </div>
    <div id="file-tree" class="file-tree">
      <div class="loading-state">Loading workspace files...</div>
    </div>
  </main>

  <!-- File Viewer Modal -->
  <div id="file-viewer-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-file-title" class="modal-title">file.js</span>
        <div class="modal-actions">
          <button id="attach-file-prompt-btn" class="btn-action">Attach to Prompt</button>
          <button id="close-modal-btn" class="btn-close">✕</button>
        </div>
      </div>
      <pre id="modal-file-body" class="code-body"><code>Loading file content...</code></pre>
    </div>
  </div>

  <footer id="input-area">
    <div id="attachment-preview" class="attachment-preview">
      <span>📎 Attached:</span>
      <span id="preview-name">file.png</span>
    </div>
    <div class="input-row">
      <button id="attach-btn" class="btn-icon" title="Attach Image/File">📷</button>
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <textarea id="prompt-input" rows="1" placeholder="Ask Antigravity IDE..."></textarea>
      <button id="send-btn" class="btn-send" title="Send Prompt">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
